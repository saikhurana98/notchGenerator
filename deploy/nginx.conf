server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # A flat pattern is plain text and can be large; the app caps each file at 32 MB and a
    # batch at 25 files, so the proxy has to allow a multi-file POST comfortably past that.
    client_max_body_size 256m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Notching a 25-file batch is minutes of CPU, not milliseconds.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
